<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>مساعدي الصوتي</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 20px;

      background: #f2f2f7;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      text-align: center;

      color: #111827;
    }


    h1 {

      margin-top: 25px;

      font-size: 25px;
    }


    #mic {

      width: 100px;

      height: 100px;

      border-radius: 50%;

      border: none;

      background: #007aff;

      color: white;

      font-size: 40px;

      margin-top: 25px;

      cursor: pointer;
    }


    #mic.listening {

      background: #dc2626;
    }


    #text {

      margin-top: 25px;

      background: white;

      padding: 20px;

      border-radius: 16px;

      min-height: 70px;

      font-size: 19px;

      line-height: 1.6;

      text-align: right;

      box-shadow:
        0 2px 8px rgba(0,0,0,.08);
    }


    .buttons {

      margin-top: 20px;

      display: flex;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;
    }


    .action {

      padding: 14px 20px;

      border: none;

      border-radius: 12px;

      background: #111827;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }


    #status {

      margin-top: 20px;

      color: #666;

      font-size: 14px;
    }

  </style>

</head>


<body>


  <h1>
    مساعدي الصوتي
  </h1>


  <button
    id="mic"
    type="button"
  >
    🎤
  </button>


  <div id="text">

    اضغط على الميكروفون وتحدث

  </div>


  <div class="buttons">

    <button
      id="send"
      class="action"
      type="button"
    >
      إرسال إلى المساعد
    </button>


    <button
      id="speak"
      class="action"
      type="button"
    >
      🔊 استمع
    </button>

  </div>


  <div id="status">

    جاهز

  </div>



<script>


/* =================================================
   1 — ضع Chat URL الخاص بـ n8n هنا
   ================================================= */

const N8N_CHAT_URL =
  "https://abdulla.app.n8n.cloud/webhook/f987df40-2b5a-4f9e-a419-71c967825711/chat";


/* =================================================
   2 — عناصر الصفحة
   ================================================= */

const mic =
  document.getElementById("mic");

const text =
  document.getElementById("text");

const send =
  document.getElementById("send");

const speak =
  document.getElementById("speak");

const status =
  document.getElementById("status");


/* =================================================
   3 — حفظ جلسة المحادثة
   ================================================= */

let sessionId =
  localStorage.getItem(
    "voice_assistant_session"
  );


if (!sessionId) {

  sessionId =
    crypto.randomUUID();

  localStorage.setItem(
    "voice_assistant_session",
    sessionId
  );

}


/* =================================================
   4 — آخر رد من المساعد
   ================================================= */

let lastReply = "";


/* =================================================
   5 — الميكروفون
   ================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  mic.disabled = true;

  status.textContent =
    "التعرف الصوتي غير متاح في هذا المتصفح";

} else {


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "ar-SA";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.onstart =
    function() {

      mic.classList.add(
        "listening"
      );

      status.textContent =
        "🎙️ أستمع إليك...";

    };


  recognition.onresult =
    function(event) {

      let result = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        result +=
          event.results[i][0].transcript;

      }


      text.textContent =
        result;

    };


  recognition.onerror =
    function(event) {

      mic.classList.remove(
        "listening"
      );

      status.textContent =
        "خطأ في الميكروفون: " +
        event.error;

    };


  recognition.onend =
    function() {

      mic.classList.remove(
        "listening"
      );

      status.textContent =
        "جاهز";

    };


  mic.addEventListener(
    "click",
    function() {

      try {

        recognition.start();

      } catch(error) {

        console.log(error);

      }

    }
  );

}


/* =================================================
   6 — إرسال الرسالة إلى n8n
   ================================================= */

send.addEventListener(
  "click",
  async function() {


    const message =
      text.textContent.trim();


    if (!message) {

      status.textContent =
        "لا توجد رسالة";

      return;

    }


    if (
      N8N_CHAT_URL ===
      "ضع Chat URL هنا"
    ) {

      status.textContent =
        "لم يتم وضع Chat URL";

      return;

    }


    status.textContent =
      "جاري الاتصال بـ n8n...";


    try {


      const separator =
        N8N_CHAT_URL.includes("?")
          ? "&"
          : "?";


      const url =
        N8N_CHAT_URL +
        separator +
        "action=sendMessage";


      const response =
        await fetch(
          url,
          {

            method: "POST",


            headers: {

              "Content-Type":
                "application/json",

              "Accept":
                "application/json"

            },


            body:
              JSON.stringify({

                action:
                  "sendMessage",

                chatInput:
                  message,

                sessionId:
                  sessionId

              })

          }
        );


      const raw =
        await response.text();


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      /* =========================================
         استخراج الرد من Streaming
         ========================================= */

      let reply = "";


      const lines =
        raw
          .split("\n")
          .map(
            line =>
              line.trim()
          )
          .filter(
            line =>
              line.length > 0
          );


      for (
        const line of lines
      ) {

        try {


          const data =
            JSON.parse(line);


          if (
            data.type === "item" &&
            typeof data.content ===
              "string"
          ) {

            reply +=
              data.content;

          }


        } catch(error) {

          /* تجاهل السطر غير الصالح */

        }

      }


      /* =========================================
         إذا كان الرد JSON عادي
         ========================================= */

      if (!reply) {


        try {


          const data =
            JSON.parse(raw);


          reply =
            data.output ??
            data.text ??
            data.response ??
            data.message ??
            raw;


        } catch(error) {


          reply =
            raw;

        }

      }


      /* =========================================
         عرض الرد
         ========================================= */

      lastReply =
        reply;


      text.textContent =
        reply;


      status.textContent =
        "تم استلام الرد ✅";


    } catch(error) {


      console.error(error);


      status.textContent =
        "تعذر الاتصال بـ n8n";


    }

  }
);


/* =================================================
   7 — زر قراءة الرد بصوت
   ================================================= */

speak.addEventListener(
  "click",
  function() {


    if (!lastReply) {

      status.textContent =
        "لا يوجد رد لقراءته";

      return;

    }


    if (
      !("speechSynthesis" in window)
    ) {

      status.textContent =
        "الصوت غير متاح في هذا المتصفح";

      return;

    }


    window.speechSynthesis.cancel();


    const speech =
      new SpeechSynthesisUtterance(
        lastReply
      );


    speech.lang =
      "ar-SA";


    speech.rate =
      0.9;


    speech.pitch =
      1;


    window.speechSynthesis.speak(
      speech
    );


    status.textContent =
      "🔊 يتم تشغيل الرد...";

  }
);


</script>

</body>

</html>
