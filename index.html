
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مساعدي الصوتي</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f2f2f7;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    #mic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: #007aff;
      color: white;
      font-size: 40px;
      margin-top: 40px;
    }

    #mic.listening {
      background: red;
    }

    #text {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      min-height: 50px;
      font-size: 20px;
    }

    #status {
      margin-top: 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <h1>مساعدي الصوتي</h1>

  <button id="mic">🎤</button>

  <div id="text">
    اضغط على الميكروفون وتحدث
  </div>

  <div id="status">
    جاهز
  </div>


  <script>

    const mic =
      document.getElementById("mic");

    const text =
      document.getElementById("text");

    const status =
      document.getElementById("status");


    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      status.textContent =
        "التعرف الصوتي غير متاح في هذا المتصفح";

    } else {

      const recognition =
        new SpeechRecognition();

      recognition.lang =
        "ar-SA";

      recognition.continuous =
        false;

      recognition.interimResults =
        true;


      recognition.onstart =
        function() {

          mic.classList.add(
            "listening"
          );

          status.textContent =
            "🎙️ أستمع إليك...";

        };


      recognition.onresult =
        function(event) {

          let result = "";

          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {

            result +=
              event.results[i][0].transcript;

          }

          text.textContent =
            result;

        };


      recognition.onerror =
        function(event) {

          status.textContent =
            "خطأ: " + event.error;

        };


      recognition.onend =
        function() {

          mic.classList.remove(
            "listening"
          );

          status.textContent =
            "جاهز";

        };


      mic.onclick =
        function() {

          try {

            recognition.start();

          } catch(error) {

            console.log(error);

          }

        };

    }

  </script>

</body>
</html>
