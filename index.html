<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>
<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>
<meta
  name="apple-mobile-web-app-title"
  content="مساعدي"
>
<title>مساعدي</title>
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #111111;
  --muted: #777777;
  --border: #e5e5e7;
  --accent: #007aff;
  --user: #007aff;
  --assistant: #ffffff;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Arial,
    sans-serif;
}
body {
  overflow: hidden;
}
.app {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 760px;
  margin: auto;
  background: var(--bg);
}
/* ================================
   HEADER
   ================================ */
.header {
  padding:
    calc(12px + env(safe-area-inset-top))
    18px
    12px;
  background:
    rgba(255,255,255,.92);
  backdrop-filter:
    blur(20px);
  -webkit-backdrop-filter:
    blur(20px);
  border-bottom:
    1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 5;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  background: #111827;
  color: white;
}
.title {
  font-size: 18px;
  font-weight: 700;
}
.subtitle {
  margin-top: 2px;
  font-size: 11px;
  color: var(--muted);
}
.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #22c55e;
  margin-left: 4px;
}
/* ================================
   CHAT
   ================================ */
#messages {
  flex: 1;
  overflow-y: auto;
  padding:
    20px
    15px
    18px;
  scroll-behavior: smooth;
}
.message-row {
  display: flex;
  margin-bottom: 15px;
  animation:
    messageIn .2s ease;
}
@keyframes messageIn {
  from {
    opacity: 0;
    transform:
      translateY(5px);
  }
  to {
    opacity: 1;
    transform:
      translateY(0);
  }
}
.message-row.user {
  justify-content: flex-start;
}
.message-row.assistant {
  justify-content: flex-end;
}
.message {
  max-width: 86%;
  padding:
    12px
    15px;
  border-radius: 19px;
  line-height: 1.65;
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-word;
}
.message.user {
  background:
    var(--user);
  color: white;
  border-bottom-left-radius: 5px;
}
.message.assistant {
  background:
    var(--assistant);
  color: var(--text);
  border:
    1px solid var(--border);
  border-bottom-right-radius: 5px;
  box-shadow:
    0 2px 8px rgba(0,0,0,.05);
}
.welcome {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--muted);
  padding: 40px 25px;
}
.welcome-icon {
  width: 70px;
  height: 70px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111827;
  color: white;
  font-size: 34px;
  margin-bottom: 15px;
}
.welcome h2 {
  margin:
    0
    0
    7px;
  color: var(--text);
  font-size: 22px;
}
.welcome p {
  margin: 0;
  font-size: 14px;
}
/* ================================
   TYPING
   ================================ */
.typing {
  display: flex;
  gap: 5px;
  align-items: center;
}
.typing span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #888;
  animation:
    typing .9s infinite;
}
.typing span:nth-child(2) {
  animation-delay:
    .15s;
}
.typing span:nth-child(3) {
  animation-delay:
    .3s;
}
@keyframes typing {
  0%, 60%, 100% {
    opacity: .3;
    transform:
      translateY(0);
  }
  30% {
    opacity: 1;
    transform:
      translateY(-3px);
  }
}
/* ================================
   COMPOSER
   ================================ */
.composer {
  padding:
    9px
    10px
    calc(9px + env(safe-area-inset-bottom));
  background:
    rgba(255,255,255,.94);
  backdrop-filter:
    blur(20px);
  -webkit-backdrop-filter:
    blur(20px);
  border-top:
    1px solid var(--border);
}
.input-container {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  background: #f0f0f2;
  border:
    1px solid #ddd;
  border-radius: 22px;
  padding:
    5px;
}
#input {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  font: inherit;
  font-size: 16px;
  min-height: 42px;
  max-height: 120px;
  padding:
    10px
    8px;
  color: var(--text);
}
#input::placeholder {
  color: #999;
}
.icon-button {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  cursor: pointer;
}
#mic {
  background: #111827;
  color: white;
}
#mic.listening {
  background: #dc2626;
  animation:
    pulse 1s infinite;
}
@keyframes pulse {
  50% {
    transform:
      scale(1.08);
  }
}
#send {
  background:
    var(--accent);
  color: white;
}
#send:disabled {
  opacity: .45;
}
.quick-actions {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-top: 8px;
  scrollbar-width: none;
}
.quick-actions::-webkit-scrollbar {
  display: none;
}
.quick {
  white-space: nowrap;
  border: none;
  background: #ededf0;
  color: #333;
  border-radius: 12px;
  padding:
    7px
    10px;
  font-size: 12px;
}
.quick:active,
.icon-button:active,
#send:active {
  transform:
    scale(.95);
}
/* ================================
   MOBILE
   ================================ */
@media (max-width: 500px) {
  .message {
    max-width: 91%;
  }
  .title {
    font-size: 17px;
  }
}
</style>
</head>
<body>
<div class="app">
<!-- ================================
     HEADER
     ================================ -->
<header class="header">
  <div class="brand">
    <div class="logo">
      🤖
    </div>
    <div>
      <div class="title">
        مساعدي
      </div>
      <div class="subtitle">
        <span class="status-dot"></span>
        متصل
      </div>
    </div>
  </div>
</header>
<!-- ================================
     MESSAGES
     ================================ -->
<main id="messages">
  <div
    class="welcome"
    id="welcome"
  >
    <div class="welcome-icon">
      🤖
    </div>
    <h2>
      مرحبًا بك
    </h2>
    <p>
      كيف يمكنني مساعدتك اليوم؟
    </p>
  </div>
</main>
<!-- ================================
     COMPOSER
     ================================ -->
<div class="composer">
  <div class="input-container">
    <button
      id="mic"
      class="icon-button"
      type="button"
      aria-label="تسجيل صوتي"
    >
      🎤
    </button>
    <textarea
      id="input"
      placeholder="اسألني أي شيء..."
      rows="1"
    ></textarea>
    <button
      id="send"
      class="icon-button"
      type="button"
      aria-label="إرسال"
    >
      ↑
    </button>
  </div>
  <div class="quick-actions">
    <button
      class="quick"
      id="location"
      type="button"
    >
      📍 موقعي
    </button>
    <button
      class="quick"
      id="speak"
      type="button"
    >
      🔊 استمع
    </button>
    <button
      class="quick"
      id="stopSpeech"
      type="button"
    >
      ⏹️ إيقاف
    </button>
    <button
      class="quick"
      id="newChat"
      type="button"
    >
      🆕 محادثة جديدة
    </button>
  </div>
</div>
</div>
<script>
/* ==================================================
   رابط n8n
   ================================================== */
const N8N_CHAT_URL =
  "https://abdulla.app.n8n.cloud/webhook/f987df40-2b5a-4f9e-a419-71c967825711/chat";
/* ==================================================
   عناصر الصفحة
   ================================================== */
const input =
  document.getElementById(
    "input"
  );
const send =
  document.getElementById(
    "send"
  );
const mic =
  document.getElementById(
    "mic"
  );
const locationButton =
  document.getElementById(
    "location"
  );
const speak =
  document.getElementById(
    "speak"
  );
const stopSpeech =
  document.getElementById(
    "stopSpeech"
  );
const newChat =
  document.getElementById(
    "newChat"
  );
const messages =
  document.getElementById(
    "messages"
  );
const welcome =
  document.getElementById(
    "welcome"
  );
/* ==================================================
   الموقع
   ================================================== */
let userLatitude =
  null;
let userLongitude =
  null;
let userAccuracy =
  null;
/* ==================================================
   الجلسة
   ================================================== */
let sessionId =
  localStorage.getItem(
    "assistant_session_id"
  );
if (!sessionId) {
  sessionId =
    crypto.randomUUID();
  localStorage.setItem(
    "assistant_session_id",
    sessionId
  );
}
/* ==================================================
   آخر رد
   ================================================== */
let lastReply = "";
/* ==================================================
   رسالة
   ================================================== */
function addMessage(
  text,
  type
) {
  if (welcome) {
    welcome.style.display =
      "none";
  }
  const row =
    document.createElement(
      "div"
    );
  row.className =
    "message-row " +
    type;
  const bubble =
    document.createElement(
      "div"
    );
  bubble.className =
    "message " +
    type;
  bubble.textContent =
    text;
  row.appendChild(
    bubble
  );
  messages.appendChild(
    row
  );
  messages.scrollTop =
    messages.scrollHeight;
}
/* ==================================================
   مؤشر الكتابة
   ================================================== */
function showTyping() {
  const row =
    document.createElement(
      "div"
    );
  row.className =
    "message-row assistant";
  row.id =
    "typing-message";
  const bubble =
    document.createElement(
      "div"
    );
  bubble.className =
    "message assistant";
  bubble.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;
  row.appendChild(
    bubble
  );
  messages.appendChild(
    row
  );
  messages.scrollTop =
    messages.scrollHeight;
}
function hideTyping() {
  const element =
    document.getElementById(
      "typing-message"
    );
  if (element) {
    element.remove();
  }
}
/* ==================================================
   الموقع
   ================================================== */
locationButton.addEventListener(
  "click",
  function() {
    if (
      !navigator.geolocation
    ) {
      alert(
        "المتصفح لا يدعم تحديد الموقع."
      );
      return;
    }
    locationButton.textContent =
      "📍 جاري التحديد...";
    navigator.geolocation.getCurrentPosition(
      function(position) {
        userLatitude =
          position.coords.latitude;
        userLongitude =
          position.coords.longitude;
        userAccuracy =
          position.coords.accuracy;
        locationButton.textContent =
          "📍 تم تحديد موقعي";
      },
      function(error) {
        console.log(
          error
        );
        userLatitude =
          null;
        userLongitude =
          null;
        userAccuracy =
          null;
        locationButton.textContent =
          "📍 موقعي";
        if (
          error.code === 1
        ) {
          alert(
            "تم رفض إذن الموقع. اسمح للموقع من إعدادات المتصفح."
          );
        }
        else {
          alert(
            "تعذر تحديد موقعك."
          );
        }
      },
      {
        enableHighAccuracy:
          true,
        timeout:
          20000,
        maximumAge:
          0
      }
    );
  }
);
/* ==================================================
   إرسال الرسالة
   ================================================== */
async function sendMessage() {
  const message =
    input.value.trim();
  if (!message) {
    return;
  }
  if (
    N8N_CHAT_URL ===
    "ضع Chat URL هنا"
  ) {
    alert(
      "ضع رابط n8n أولًا داخل الكود."
    );
    return;
  }
  addMessage(
    message,
    "user"
  );
  input.value =
    "";
  input.style.height =
    "42px";
  send.disabled =
    true;
  showTyping();
  /* =================================================
     تجهيز الرسالة
     ================================================= */
  let messageForAI =
    message;
  if (
    userLatitude !== null &&
    userLongitude !== null
  ) {
    messageForAI +=
      "\n\n" +
      "=== معلومات موقع المستخدم ===" +
      "\n" +
      "Latitude: " +
      userLatitude +
      "\n" +
      "Longitude: " +
      userLongitude +
      "\n" +
      "Accuracy: " +
      userAccuracy +
      " meters" +
      "\n" +
      "هذه هي إحداثيات الموقع الحالي للمستخدم." +
      "\n" +
      "=== نهاية معلومات الموقع ===";
  }
  console.log(
    "Sending to n8n:",
    messageForAI
  );
  try {
    const separator =
      N8N_CHAT_URL.includes("?")
        ? "&"
        : "?";
    const url =
      N8N_CHAT_URL +
      separator +
      "action=sendMessage";
    const response =
      await fetch(
        url,
        {
          method:
            "POST",
          headers: {
            "Content-Type":
              "application/json",
            "Accept":
              "application/json"
          },
          body:
            JSON.stringify({
              action:
                "sendMessage",
              chatInput:
                messageForAI,
              sessionId:
                sessionId
            })
        }
      );
    const raw =
      await response.text();
    if (!response.ok) {
      throw new Error(
        "HTTP " +
        response.status
      );
    }
    hideTyping();
    let reply =
      "";
    /* =================================================
       Streaming response
       ================================================= */
    const lines =
      raw
        .split("\n")
        .map(
          line =>
            line.trim()
        )
        .filter(
          line =>
            line.length > 0
        );
    for (
      const line of lines
    ) {
      try {
        const data =
          JSON.parse(line);
        if (
          data.type === "item" &&
          typeof data.content ===
            "string"
        ) {
          reply +=
            data.content;
        }
      }
      catch(error) {
        /* تجاهل السطر غير JSON */
      }
    }
    /* =================================================
       JSON عادي
       ================================================= */
    if (!reply) {
      try {
        const data =
          JSON.parse(raw);
        reply =
          data.output ??
          data.text ??
          data.response ??
          data.message ??
          raw;
      }
      catch(error) {
        reply =
          raw;
      }
    }
    lastReply =
      reply;
    addMessage(
      reply,
      "assistant"
    );
  }
  catch(error) {
    console.error(
      error
    );
    hideTyping();
    addMessage(
      "حدث خطأ أثناء الاتصال بالمساعد.",
      "assistant"
    );
  }
  finally {
    send.disabled =
      false;
  }
}
/* ==================================================
   زر الإرسال
   ================================================== */
send.addEventListener(
  "click",
  sendMessage
);
/* ==================================================
   Enter
   ================================================== */
input.addEventListener(
  "keydown",
  function(event) {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
/* ==================================================
   تغيير ارتفاع مربع النص
   ================================================== */
input.addEventListener(
  "input",
  function() {
    this.style.height =
      "42px";
    this.style.height =
      Math.min(
        this.scrollHeight,
        120
      ) +
      "px";
  }
);
/* ==================================================
   الكلام
   ================================================== */
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const recognition =
    new SpeechRecognition();
  recognition.lang =
    "ar-SA";
  recognition.continuous =
    false;
  recognition.interimResults =
    true;
  recognition.onstart =
    function() {
      mic.classList.add(
        "listening"
      );
    };
  recognition.onresult =
    function(event) {
      let text =
        "";
      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {
        text +=
          event.results[i][0].transcript;
      }
      input.value =
        text;
      input.dispatchEvent(
        new Event(
          "input"
        )
      );
    };
  recognition.onerror =
    function(event) {
      console.log(
        event.error
      );
      mic.classList.remove(
        "listening"
      );
    };
  recognition.onend =
    function() {
      mic.classList.remove(
        "listening"
      );
    };
  mic.addEventListener(
    "click",
    function() {
      try {
        recognition.start();
      }
      catch(error) {
        console.log(
          error
        );
      }
    }
  );
}
else {
  mic.disabled =
    true;
}
/* ==================================================
   قراءة الرد
   ================================================== */
speak.addEventListener(
  "click",
  function() {
    if (!lastReply) {
      return;
    }
    if (
      !("speechSynthesis" in window)
    ) {
      return;
    }
    window.speechSynthesis.cancel();
    const speech =
      new SpeechSynthesisUtterance(
        lastReply
      );
    speech.lang =
      "ar-SA";
    speech.rate =
      0.9;
    speech.pitch =
      1;
    window.speechSynthesis.speak(
      speech
    );
  }
);
/* ==================================================
   إيقاف الصوت
   ================================================== */
stopSpeech.addEventListener(
  "click",
  function() {
    if (
      "speechSynthesis" in window
    ) {
      window.speechSynthesis.cancel();
    }
  }
);
/* ==================================================
   محادثة جديدة
   ================================================== */
newChat.addEventListener(
  "click",
  function() {
    if (
      !confirm(
        "بدء محادثة جديدة؟"
      )
    ) {
      return;
    }
    sessionId =
      crypto.randomUUID();
    localStorage.setItem(
      "assistant_session_id",
      sessionId
    );
    messages.innerHTML = `
      <div
        class="welcome"
        id="welcome"
      >
        <div class="welcome-icon">
          🤖
        </div>
        <h2>
          محادثة جديدة
        </h2>
        <p>
          كيف يمكنني مساعدتك؟
        </p>
      </div>
    `;
    lastReply =
      "";
    userLatitude =
      null;
    userLongitude =
      null;
    userAccuracy =
      null;
    locationButton.textContent =
      "📍 موقعي";
  }
);
</script>
</body>
</html>
