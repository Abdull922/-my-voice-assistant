<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مساعدي الصوتي</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f2f2f7;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    #mic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: #007aff;
      color: white;
      font-size: 40px;
      margin-top: 40px;
    }

    #mic.listening {
      background: red;
    }

    #text {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      min-height: 50px;
      font-size: 20px;
    }

    #send {
      margin-top: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 17px;
    }

    #status {
      margin-top: 20px;
      color: #666;
    }
  </style>
</head>

<body>

<h1>مساعدي الصوتي</h1>

<button id="mic">🎤</button>

<div id="text">
  اضغط على الميكروفون وتحدث
</div>

<button id="send">
  إرسال إلى المساعد
</button>

<div id="status">
  جاهز
</div>


<script>

/* ==================================================
   1 — ضع Chat URL هنا
   ==================================================

   احذف النص الموجود بين علامتي الاقتباس
   وضع Chat URL الذي نسخته من n8n.

   مثال فقط:

   const N8N_CHAT_URL =
     "https://example.n8n.cloud/webhook/xxxx/chat";

   ==================================================
*/

const N8N_CHAT_URL =
  "https://abdulla.app.n8n.cloud/webhook/f987df40-2b5a-4f9e-a419-71c967825711/chat";


/* ==================================================
   2 — عناصر الصفحة
   ==================================================
*/

const mic =
  document.getElementById("mic");

const text =
  document.getElementById("text");

const send =
  document.getElementById("send");

const status =
  document.getElementById("status");


/* ==================================================
   3 — Session ID
   ==================================================
*/

let sessionId =
  localStorage.getItem(
    "voice_assistant_session"
  );

if (!sessionId) {

  sessionId =
    crypto.randomUUID();

  localStorage.setItem(
    "voice_assistant_session",
    sessionId
  );
}


/* ==================================================
   4 — التعرف على الصوت
   ==================================================
*/

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  mic.disabled = true;

  status.textContent =
    "التعرف الصوتي غير متاح في هذا المتصفح";

} else {

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "ar-SA";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;


  mic.addEventListener(
    "click",
    function() {

      try {

        recognition.start();

      } catch(error) {

        console.log(error);

      }

    }
  );


  recognition.addEventListener(
    "start",
    function() {

      mic.classList.add(
        "listening"
      );

      status.textContent =
        "🎙️ أستمع إليك...";

    }
  );


  recognition.addEventListener(
    "result",
    function(event) {

      let result = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        result +=
          event.results[i][0].transcript;

      }

      text.textContent =
        result;

    }
  );


  recognition.addEventListener(
    "error",
    function(event) {

      status.textContent =
        "خطأ في الميكروفون: " +
        event.error;

    }
  );


  recognition.addEventListener(
    "end",
    function() {

      mic.classList.remove(
        "listening"
      );

      status.textContent =
        "جاهز";

    }
  );

}


/* ==================================================
   5 — إرسال النص إلى n8n
   ==================================================
*/

send.addEventListener(
  "click",
  async function() {

    const message =
      text.textContent.trim();


    if (!message) {

      status.textContent =
        "لا توجد رسالة لإرسالها";

      return;

    }


    if (
      N8N_CHAT_URL ===
      "ضع Chat URL هنا"
    ) {

      status.textContent =
        "لم تضع Chat URL الخاص بـ n8n";

      return;

    }


    status.textContent =
      "جاري الإرسال إلى n8n...";


    try {

      const separator =
        N8N_CHAT_URL.includes("?")
          ? "&"
          : "?";


      const url =
        N8N_CHAT_URL +
        separator +
        "action=sendMessage";


      const response =
        await fetch(
          url,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body:
              JSON.stringify({

                action:
                  "sendMessage",

                chatInput:
                  message,

                sessionId:
                  sessionId

              })
          }
        );
const raw =
  await response.text();

if (!response.ok) {
  throw new Error(
    "HTTP " + response.status
  );
}

let reply = "";

const lines =
  raw
    .split("\n")
    .map(line => line.trim())
    .filter(line => line);

for (const line of lines) {

  try {

    const data =
      JSON.parse(line);

    if (
      data.type === "item" &&
      typeof data.content === "string"
    ) {

      reply += data.content;

    }

  } catch(error) {

    // تجاهل السطر غير الصالح

  }
}

if (!reply) {

  try {

    const data =
      JSON.parse(raw);

    reply =
      data.output ??
      data.text ??
      data.response ??
      data.message ??
      raw;

  } catch(error) {

    reply = raw;

  }
}

text.textContent =
  reply;

status.textContent =
  "تم استلام الرد ✅";



    } catch(error) {

      console.error(error);

      status.textContent =
        "تعذر الاتصال بـ n8n";

    }

  }
);

</script>

</body>
</html>
